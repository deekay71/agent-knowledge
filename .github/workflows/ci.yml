# Server-side copy of the local guards. Local Git hooks are opt-in per clone and do not run
# when a pull request is merged on GitHub, so this workflow is what protects main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs can stop; every commit that lands on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Python ${{ matrix.python }}
    # Pinned: Python 3.9 (the documented minimum, and macOS's system python3) has no
    # ubuntu-26.04 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # history lint needs the base commit

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Structural and history lint
        env:
          # Pull request: the checkout is GitHub's merge commit (base + head), validated like a
          # local two-parent merge. Push to main: compare against the previous main commit.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          INCOMING: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if [ -n "$INCOMING" ]; then
              python scripts/wiki.py lint --base "$BASE" --merge-parent "$INCOMING"
            else
              python scripts/wiki.py lint --base "$BASE"
            fi
          else
            echo "No usable base commit (new branch or rewritten history): structural lint only."
            python scripts/wiki.py lint
          fi

      - name: Portable vault matches canonical sources
        run: python scripts/export_vault.py --check
